[tool.poetry]
name = "finance-rag"
version = "0.1.0"
description = "Analyse von Kontoauszügen mittels RAG"
authors = ["Dein Name"]
package-mode = false 

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

pymupdf = "^1.28"
pandas = "^3.0"
numpy = "^2.5"
chromadb = "^1.5"
sentence-transformers = "^5.6"
langchain = "^1.3"
langchain-community = "^0.4"
ollama = "^0.6"
python-dotenv = "^1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"